  <path d="M 120 90 L 200 120 L 280 90 L 360 170 L 320 200 L 285 160 L 285 330 L 115 330 L 115 160 L 80 200 L 40 170 Z" fill="url(#brown_suede)" stroke="#B45309" stroke-width="3"/>
